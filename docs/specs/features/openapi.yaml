openapi: 3.0.3
info:
  title: Dev Portfolio & Blog API
  version: 1.0.0
  description: Canonical specification for the portfolio blog engine and headless CMS.
paths:
  /api/v1/posts:
    get:
      summary: List published posts
      operationId: ListPublishedPosts
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
            example: "pt-BR"
      responses:
        '200':
          description: Paginated post items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPostSummary'

  /api/v1/posts/{slug}:
    get:
      summary: Get post details by localized slug
      operationId: GetPostBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "building-clean-architecture-dotnet-8"
      responses:
        '200':
          description: Detailed post information including translation references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '404':
          description: Post not found

components:
  schemas:
    PostSummary:
      type: object
      required: [id, title, slug, language, summary, readingTimeMinutes, categoryName, categorySlug]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        language:
          type: string
          example: "en-US"
        summary:
          type: string
        coverImage:
          type: string
          nullable: true
        readingTimeMinutes:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        categoryName:
          type: string
        categorySlug:
          type: string

    PagedPostSummary:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    PostTranslation:
      type: object
      required: [language, slug]
      properties:
        language:
          type: string
          example: "pt-BR"
        slug:
          type: string
          example: "construindo-clean-architecture-dotnet-8"

    PostDetail:
      type: object
      required: [id, title, slug, language, translationGroupId, summary, contentMd, readingTimeMinutes, authorName, categoryName, categorySlug, tags, availableTranslations]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        language:
          type: string
          example: "en-US"
        translationGroupId:
          type: string
          format: uuid
        summary:
          type: string
        contentMd:
          type: string
        coverImage:
          type: string
          nullable: true
        readingTimeMinutes:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        authorName:
          type: string
        categoryName:
          type: string
        categorySlug:
          type: string
        tags:
          type: array
          items:
            type: string
        availableTranslations:
          type: array
          items:
            $ref: '#/components/schemas/PostTranslation'