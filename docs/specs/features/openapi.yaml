openapi: 3.0.3
info:
  title: Dev Portfolio & Blog API
  version: 1.0.0
  description: Canonical specification for the portfolio blog engine and headless CMS.
paths:
  /api/v1/posts:
    get:
      summary: List published posts
      operationId: ListPublishedPosts
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
            example: "pt-BR"
      responses:
        '200':
          description: Paginated post items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedPostSummary'

  /api/v1/posts/{slug}:
    get:
      summary: Get post details by localized slug
      operationId: GetPostBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "building-clean-architecture-dotnet-8"
      responses:
        '200':
          description: Detailed post information including translation references
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostDetail'
        '404':
          description: Post not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/posts:
    post:
      summary: Create a new post or translation
      operationId: CreatePost
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
      responses:
        '201':
          description: Post successfully created
          headers:
            Location:
              schema:
                type: string
              description: Relative URL to the created post resource
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostCreated'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Referenced Category or TranslationGroup not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Slug or TranslationGroup language conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/posts/{id}:
    put:
      summary: Update an existing post
      operationId: UpdatePost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePostRequest'
      responses:
        '200':
          description: Post updated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostUpdated'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '404':
          description: Post not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Slug collision
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/posts/{id}/publish:
    post:
      summary: Publish an existing draft post
      operationId: PublishPost
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Post published successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostPublished'
        '404':
          description: Post not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/posts/drafts:
    get:
      summary: List draft posts
      operationId: ListDraftPosts
      parameters:
        - name: page
          in: query
          required: false
          schema:
            type: integer
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            default: 10
        - name: category
          in: query
          required: false
          schema:
            type: string
        - name: language
          in: query
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Paginated draft posts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagedDraftSummary'

  /api/v1/posts/drafts/{id}:
    get:
      summary: Get draft post details by identifier
      operationId: GetDraftById
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Detailed draft post information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DraftDetail'
        '404':
          description: Draft post not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/categories:
    get:
      summary: List all categories with published post counts
      operationId: ListCategories
      responses:
        '200':
          description: List of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CategorySummary'
    post:
      summary: Create a new category
      operationId: CreateCategory
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCategoryRequest'
      responses:
        '201':
          description: Category created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryCreated'
        '400':
          description: Validation error
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'
        '409':
          description: Category slug conflict
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

  /api/v1/categories/{slug}:
    get:
      summary: Get category details by slug
      operationId: GetCategoryBySlug
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            example: "architecture"
      responses:
        '200':
          description: Category details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CategoryDetail'
        '404':
          description: Category not found
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ProblemDetails'

components:
  schemas:
    ProblemDetails:
      type: object
      required: [status, title]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
        traceId:
          type: string
    PostSummary:
      type: object
      required: [id, title, slug, language, summary, readingTimeMinutes, categoryName, categorySlug]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        language:
          type: string
          example: "en-US"
        summary:
          type: string
        coverImage:
          type: string
          nullable: true
        readingTimeMinutes:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        categoryName:
          type: string
        categorySlug:
          type: string

    PagedPostSummary:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostSummary'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    PostTranslation:
      type: object
      required: [language, slug]
      properties:
        language:
          type: string
          example: "pt-BR"
        slug:
          type: string
          example: "construindo-clean-architecture-dotnet-8"

    PostDetail:
      type: object
      required: [id, title, slug, language, translationGroupId, summary, contentMd, readingTimeMinutes, authorName, categoryName, categorySlug, tags, availableTranslations]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        language:
          type: string
          example: "en-US"
        translationGroupId:
          type: string
          format: uuid
        summary:
          type: string
        contentMd:
          type: string
        coverImage:
          type: string
          nullable: true
        readingTimeMinutes:
          type: integer
        publishedAt:
          type: string
          format: date-time
          nullable: true
        authorName:
          type: string
        categoryName:
          type: string
        categorySlug:
          type: string
        tags:
          type: array
          items:
            type: string
        availableTranslations:
          type: array
          items:
            $ref: '#/components/schemas/PostTranslation'

    CreatePostRequest:
      type: object
      required: [title, summary, contentMd]
      properties:
        title:
          type: string
        slug:
          type: string
          nullable: true
        language:
          type: string
          example: "en-US"
          nullable: true
        translationGroupId:
          type: string
          format: uuid
          nullable: true
        summary:
          type: string
        contentMd:
          type: string
        coverImage:
          type: string
          nullable: true
        categoryId:
          type: string
          format: uuid
          nullable: true
        categorySlug:
          type: string
          nullable: true
          example: "architecture"
        tags:
          type: array
          items:
            type: string
          nullable: true
        publishNow:
          type: boolean
          default: false
        authorId:
          type: string
          format: uuid
          nullable: true

    PostCreated:
      type: object
      required: [id, slug, language, translationGroupId, status, createdAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        language:
          type: string
        translationGroupId:
          type: string
          format: uuid
        status:
          type: string
          example: "Draft"
        createdAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true

    PostPublished:
      type: object
      required: [id, slug, status, publishedAt]
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        status:
          type: string
          example: "Published"
        publishedAt:
          type: string
          format: date-time

    CategorySummary:
      type: object
      required: [id, name, slug, isFeatured, postCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        isFeatured:
          type: boolean
        postCount:
          type: integer

    CategoryDetail:
      type: object
      required: [id, name, slug, isFeatured, postCount]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        isFeatured:
          type: boolean
        postCount:
          type: integer

    CreateCategoryRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          example: "DevOps & Cloud"
        slug:
          type: string
          nullable: true
          example: "devops-cloud"
        isFeatured:
          type: boolean
          default: false

    CategoryCreated:
      type: object
      required: [id, name, slug, isFeatured]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        slug:
          type: string
        isFeatured:
          type: boolean

    UpdatePostRequest:
      type: object
      required: [title, summary, contentMd]
      properties:
        title:
          type: string
        summary:
          type: string
        contentMd:
          type: string
        categoryId:
          type: string
          format: uuid
          nullable: true
        categorySlug:
          type: string
          nullable: true
        slug:
          type: string
          nullable: true
        coverImage:
          type: string
          nullable: true
        tags:
          type: array
          items:
            type: string
          nullable: true

    PostUpdated:
      type: object
      required: [id, title, slug, language, translationGroupId, summary, contentMd, readingTimeMinutes, status, createdAt, updatedAt, categoryName, categorySlug, tags]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        language:
          type: string
        translationGroupId:
          type: string
          format: uuid
        summary:
          type: string
        contentMd:
          type: string
        coverImage:
          type: string
          nullable: true
        readingTimeMinutes:
          type: integer
        status:
          type: string
          example: "Draft"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        publishedAt:
          type: string
          format: date-time
          nullable: true
        categoryName:
          type: string
        categorySlug:
          type: string
        tags:
          type: array
          items:
            type: string

    DraftSummary:
      type: object
      required: [id, title, slug, language, summary, readingTimeMinutes, status, createdAt, updatedAt, categoryName, categorySlug]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        language:
          type: string
        summary:
          type: string
        coverImage:
          type: string
          nullable: true
        readingTimeMinutes:
          type: integer
        status:
          type: string
          example: "Draft"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        categoryName:
          type: string
        categorySlug:
          type: string

    PagedDraftSummary:
      type: object
      required: [items, page, pageSize, totalItems, totalPages]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DraftSummary'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer

    DraftDetail:
      type: object
      required: [id, title, slug, language, translationGroupId, summary, contentMd, readingTimeMinutes, status, createdAt, updatedAt, authorName, categoryName, categorySlug, tags]
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        slug:
          type: string
        language:
          type: string
        translationGroupId:
          type: string
          format: uuid
        summary:
          type: string
        contentMd:
          type: string
        coverImage:
          type: string
          nullable: true
        readingTimeMinutes:
          type: integer
        status:
          type: string
          example: "Draft"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        authorName:
          type: string
        categoryName:
          type: string
        categorySlug:
          type: string
        tags:
          type: array
          items:
            type: string